on:
  workflow_call:
  # Permissions inherited from caller workflow

permissions: {}

jobs:
  test:
    # continue-on-error: ${{ matrix.experimental }}
    strategy:
      # Run regular in-toto tests on each OS/Python combination, plus linters
      # on Linux/Python3.x only.
      matrix:
        # python-version: ['3.8', '3.9', '3.10', '3.11']
        python-version: ['3.11']
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest]
        toxenv: [py]
        # experimental: [false]
        retval: [0]
        secs: [20]
        include:
          - python-version: 3.x
            os: ubuntu-latest
            toxenv: with-sslib-main
            # experimental: true
            retval: 1
            secs: 0

    runs-on: ${{ matrix.os }}

    steps:
      - name: Run test
        run: sleep ${{ matrix.secs }} && (exit ${{ matrix.retval }})

